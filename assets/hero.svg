<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Groundwork — a setup protocol for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1E2A44" stroke-width="1" opacity="0.55">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300M900 0V300M1050 0V300"/>
  </g>

  <!-- foundation blocks -->
  <g opacity="0.9">
    <rect x="64" y="232" width="46" height="14" rx="3" fill="#F59E0B" opacity="0.35"/>
    <rect x="118" y="232" width="46" height="14" rx="3" fill="#F59E0B" opacity="0.5"/>
    <rect x="172" y="232" width="46" height="14" rx="3" fill="#F59E0B" opacity="0.7"/>
    <rect x="226" y="232" width="46" height="14" rx="3" fill="#F59E0B"/>
  </g>

  <text x="64" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="800" fill="#F8FAFC" letter-spacing="1">GROUNDWORK</text>

  <rect x="64" y="122" width="460" height="2" fill="url(#rule)"/>

  <text x="64" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" fill="#94A3B8">Machine setup · project bootstrap · repair</text>

  <text x="64" y="192" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" fill="#F59E0B">A protocol, not a vibe.</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="14" fill="#CBD5E1">
    <rect x="828" y="86" width="308" height="38" rx="19" fill="#16233D" stroke="#26375C"/>
    <text x="852" y="111">9 rules you cannot negotiate</text>

    <rect x="828" y="134" width="308" height="38" rx="19" fill="#16233D" stroke="#26375C"/>
    <text x="852" y="159">3 paths, 16 prompts mapped</text>

    <rect x="828" y="182" width="308" height="38" rx="19" fill="#16233D" stroke="#26375C"/>
    <text x="852" y="207">5 agent hosts, one folder</text>

    <rect x="828" y="230" width="308" height="38" rx="19" fill="#16233D" stroke="#26375C"/>
    <text x="852" y="255">MIT licensed, no dependencies</text>
  </g>
</svg>
