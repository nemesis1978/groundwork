<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Three paths: machine setup, new project, existing project">
  <rect width="1200" height="470" fill="#0B1220"/>

  <text x="64" y="58" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#F8FAFC">Three paths, one protocol</text>
  <text x="64" y="86" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="15" fill="#94A3B8">The agent picks the path from what you ask. It never runs all three.</text>

  <!-- Card 1 -->
  <g>
    <rect x="64" y="116" width="336" height="300" rx="14" fill="#111C33" stroke="#26375C"/>
    <rect x="64" y="116" width="336" height="6" rx="3" fill="#38BDF8"/>
    <text x="90" y="162" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#38BDF8">PATH A</text>
    <text x="90" y="192" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Machine setup</text>

    <g font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#CBD5E1">
      <text x="90" y="228">1  Choose where it runs</text>
      <text x="90" y="256">2  Inventory what exists</text>
      <text x="90" y="284">3  Install only what is missing</text>
      <text x="90" y="312">4  Configure each agent host</text>
      <text x="90" y="340">5  Emit environment manifest</text>
      <text x="90" y="368">6  Reproduce to verify</text>
    </g>
    <text x="90" y="400" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#64748B">no reinstall, no guessing</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="432" y="116" width="336" height="300" rx="14" fill="#111C33" stroke="#26375C"/>
    <rect x="432" y="116" width="336" height="6" rx="3" fill="#F59E0B"/>
    <text x="458" y="162" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#F59E0B">PATH B</text>
    <text x="458" y="192" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">New project</text>

    <g font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#CBD5E1">
      <text x="458" y="228">1  Inspect destination</text>
      <text x="458" y="256">2  Write PRODUCT.md first</text>
      <text x="458" y="284">3  Official scaffold</text>
      <text x="458" y="312">4  Core: Drizzle, Zod, Pino</text>
      <text x="458" y="340">5  Route only needed skills</text>
      <text x="458" y="368">6  Docs from the manifest</text>
      <text x="458" y="394">7  Verify and report evidence</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="800" y="116" width="336" height="300" rx="14" fill="#111C33" stroke="#26375C"/>
    <rect x="800" y="116" width="336" height="6" rx="3" fill="#34D399"/>
    <text x="826" y="162" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#34D399">PATH C</text>
    <text x="826" y="192" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Existing project</text>

    <g font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#CBD5E1">
      <text x="826" y="228">1  Read-only diagnosis</text>
      <text x="826" y="256">2  PRODUCT.md from facts</text>
      <text x="826" y="284">3  Decision per component</text>
      <text x="826" y="312">4  Small verified batches</text>
      <text x="826" y="340">5  Before / after metrics</text>
      <text x="826" y="368">6  Written handoff</text>
    </g>
    <text x="826" y="400" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#64748B">never migrate the stack</text>
  </g>

  <text x="64" y="448" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#475569">
    product before foundation · proportional adoption · evidence over claims
  </text>
</svg>
